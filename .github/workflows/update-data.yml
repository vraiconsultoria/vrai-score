# Vrai Score — atualização automática de dados (v2, ATIVO)
#
# Roda dias úteis às 22:00 UTC (19:00 BRT, pós-fechamento da B3).
# Também pode ser disparado manualmente em Actions → "Run workflow".

name: Atualizar dados das ações

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        working-directory: scripts
        run: npm install

      - name: Atualizar stocks.json
        run: node scripts/update-data.js

      - name: Commit se houver mudanças
        run: |
          git config user.name "vrai-score-bot"
          git config user.email "bot@vraiconsultoria.com"
          git add data/stocks.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudança nos dados."
          else
            git commit -m "chore: atualização automática ($(date -u +%Y-%m-%d))"
            git push
          fi
